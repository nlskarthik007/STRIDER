<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 190" width="100%" height="190">
  <rect width="960" height="190" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
  <g transform="translate(24, 30)">
    <rect width="205" height="130" rx="10" fill="#111c33" stroke="#38bdf8" stroke-width="1.5" />
    <text x="102" y="28" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#38bdf8">28-D LOCAL SENSORS</text>
    <text x="102" y="54" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#e2e8f0">16-Ray Log-LIDAR (2.0 m)</text>
    <text x="102" y="74" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#e2e8f0">4-D Encoder + Z-Gyro Rate</text>
    <text x="102" y="94" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#e2e8f0">4-D Ego Goal Vector</text>
    <text x="102" y="114" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#94a3b8">4-Sector Odom Memory</text>
  </g>
  <line x1="229" y1="95" x2="269" y2="95" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6 4">
    <animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.9s" repeatCount="indefinite" />
  </line>
  <g transform="translate(269, 30)">
    <rect width="210" height="130" rx="10" fill="#111c33" stroke="#22d3ee" stroke-width="1.5" />
    <text x="105" y="28" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#22d3ee">RECURRENT POLICY (10 Hz)</text>
    <text x="105" y="54" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#e2e8f0">192-Unit PyTorch LSTM</text>
    <text x="105" y="74" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#e2e8f0">[128, 64] Actor MLP</text>
    <text x="105" y="94" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#e2e8f0">10-Round Unified DAgger</text>
    <text x="105" y="114" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#94a3b8">Output: Continuous (v, ω)</text>
  </g>
  <line x1="479" y1="95" x2="519" y2="95" stroke="#10b981" stroke-width="2.5" stroke-dasharray="6 4">
    <animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.9s" repeatCount="indefinite" />
  </line>
  <g transform="translate(519, 30)">
    <rect width="205" height="130" rx="10" fill="#111c33" stroke="#10b981" stroke-width="1.5" />
    <text x="102" y="28" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#10b981">200 Hz Z-GYRO PI</text>
    <text x="102" y="54" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#e2e8f0">Leaky Yaw-Rate Integral</text>
    <text x="102" y="74" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#e2e8f0">Kp = 0.75 • Ki = 1.40</text>
    <text x="102" y="94" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#e2e8f0">Slew-Rate Command Limit</text>
    <text x="102" y="114" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#94a3b8">Wheel Vel (ω_L, ω_R)</text>
  </g>
  <line x1="724" y1="95" x2="764" y2="95" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6 4">
    <animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.9s" repeatCount="indefinite" />
  </line>
  <g transform="translate(764, 30)">
    <rect width="172" height="130" rx="10" fill="#111c33" stroke="#f59e0b" stroke-width="1.5" />
    <text x="86" y="28" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#f59e0b">MUJOCO RK4</text>
    <text x="86" y="54" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#e2e8f0">4 Map Geometries</text>
    <text x="86" y="74" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#e2e8f0">5 Surface Frictions</text>
    <text x="86" y="94" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#e2e8f0">Quadratic Drag</text>
    <text x="86" y="114" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#94a3b8">0.000 m LIDAR Error</text>
  </g>
